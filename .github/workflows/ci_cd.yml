name: AgeCare Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  analyze-and-test:
    name: Lint, Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage

  build-android:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK (Demo / Mock Mode)
        run: flutter build apk --release --dart-define=USE_MOCKS=true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agecare-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
