name: Build Android APK

on:
  push:
    branches:
      - app-mobile
      - main
  # Esto permite ejecutar el compilador manualmente desde la página de GitHub cuando quieras
  workflow_dispatch: 

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Acelera compilaciones futuras guardando el SDK en caché

      - name: 📦 Instalar dependencias de Dart
        run: flutter pub get

      - name: 🔨 Compilar APK (Producción)
        run: |
          flutter build apk --release \
          --dart-define=USE_MOCKS=false \
          --dart-define=API_BASE_URL=https://agecare.open-cluster.org

      - name: 📤 Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: agecare-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7 # GitHub guardará el archivo por una semana
